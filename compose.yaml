services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: khfashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khfashion_dev}
      POSTGRES_DB: khfashion
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - khfashion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khfashion -d khfashion']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  khfashion_pg:
